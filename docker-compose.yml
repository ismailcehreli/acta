name: acta

# Infrastructure components (§17.2). The reverse proxy and certificates are
# managed outside this stack.
#
# Public exposure (§15.5): no service binds to every host interface.
# Database and application ports bind only to 127.0.0.1; public access must go
# through a reverse proxy over HTTPS. Passwords have no defaults, so the stack
# cannot start until `.env` is populated.
# (Audit 2026-08-17, finding 2.)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Separate server used by the tests; it hosts two databases
  # (faaliyet_test → Vitest, faaliyet_e2e → Playwright). Its data lives in tmpfs
  # and is removed on shutdown. It uses a separate profile so it cannot run in
  # production:
  #   docker compose --profile test up -d test-postgres
  test-postgres:
    image: postgres:17-alpine
    profiles: ["test"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-faaliyet_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-faaliyet_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-faaliyet_test}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEST_POSTGRES_USER:-faaliyet_test} -d ${TEST_POSTGRES_DB:-faaliyet_test}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # Database migrations run in a separate one-shot step, not during application
  # startup. Startup migrations race when two copies launch at once, can fail
  # health checks when they take a long time, and can create restart loops after
  # a failure. The app and worker wait for this step to succeed; otherwise the
  # application never starts.
  # Run manually with: docker compose run --rm migrate
  migrate:
    build: .
    image: acta:local
    restart: "no"
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      TZ: Europe/Istanbul
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    image: acta:local
    restart: unless-stopped
    # Start the process directly; inserting a package manager would prevent the
    # shutdown signal (SIGTERM) from reaching the application and force-kill the
    # container.
    command: ["node_modules/.bin/next", "start"]
    init: true
    environment:
      NODE_ENV: production
      TZ: Europe/Istanbul
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Read tickets (§10.2) are signed with this secret; it has no default.
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ATTACHMENT_STORAGE_DIR: /veri/ekler
      # Profile pictures also live on disk and **must be persistent**. Before
      # this variable was configured, they were written inside the container at
      # `/app/storage/avatars`, so every `docker compose up --build` removed
      # them. The database retained `avatarExtension`, but the files disappeared
      # and every profile returned 404 (Audit 2026-08-23, finding 5).
      AVATAR_STORAGE_DIR: /veri/avatarlar
    volumes:
      # Attachments live on a persistent volume. If they stayed in the container,
      # every update would remove the files while leaving database records
      # behind (§15.4).
      - attachment-data:/veri/ekler
      # Avatars use a **separate volume**. Sharing it with attachments would make
      # backup/restore unable to separate them; restoring one would restore the
      # other as well.
      - avatar-data:/veri/avatarlar
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    image: acta:local
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    init: true
    environment:
      NODE_ENV: production
      TZ: Europe/Istanbul
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # The worker needs the same secret to decrypt the SMTP password.
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ATTACHMENT_STORAGE_DIR: /veri/ekler
    volumes:
      - attachment-data:/veri/ekler
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  attachment-data:
  avatar-data:
